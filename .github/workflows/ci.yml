name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # rustup reads the shared version and components from rust-toolchain.toml.
      - name: Install project Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: docker build -t jrip-ghostscript:local adapters/ghostscript
      - run: docker build -t jrip-mupdf:local adapters/mupdf
      - run: cargo test --workspace --locked -- --ignored
