name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # rustup reads the shared version and components from rust-toolchain.toml.
      - name: Install project Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Install independent IPP test client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cups-ipp-utils cups-client
      - run: cupstestppd adapters/cups/jrip-pdf-proof.ppd
      - run: docker build -f adapters/ghostscript/Dockerfile -t jrip-ghostscript:local .
      - run: docker build -f adapters/mupdf/Dockerfile -t jrip-mupdf:local .
      - run: docker build -f adapters/color/Dockerfile -t jrip-color:local .
      - name: Install independent ACX schema validator
        run: |
          python3 -m venv /tmp/jrip-acx-validator
          /tmp/jrip-acx-validator/bin/pip install -r tests/acx/requirements.txt
          echo "/tmp/jrip-acx-validator/bin" >> "$GITHUB_PATH"
          node --version
      - name: Test source ICC declaration analyzer
        run: |
          /tmp/jrip-acx-validator/bin/pip install -r adapters/source_profiles/requirements.txt
          python3 -m unittest discover -s adapters/source_profiles -p 'test_*.py' -v
      - run: cargo test --workspace --locked -- --ignored
