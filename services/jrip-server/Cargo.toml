[package]
name = "jrip-server"
version.workspace = true
edition.workspace = true
[dependencies]
rip-core.workspace = true
rip-storage.workspace = true
rip-interpreter.workspace = true
rip-jobs.workspace = true
rip-acx.workspace = true
rip-printer.workspace = true
rip-raster.workspace = true
rip-color.workspace = true
tar = "0.4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["multipart"] }
sha2 = "0.10"
rustls-pemfile = "=2.2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures-util = "0.3"
tempfile = "3"
[dev-dependencies]
ring = "0.17"
lcms2 = { version = "=6.2.0", features = ["static"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tiff = "0.10"
rip-ipp.workspace = true
jrip-ipp = { path = "../jrip-ipp" }
