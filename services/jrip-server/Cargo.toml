[package]
name = "jrip-server"
version.workspace = true
edition.workspace = true
[dependencies]
rip-core.workspace = true
rip-storage.workspace = true
rip-interpreter.workspace = true
rip-jobs.workspace = true
rip-acx.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["multipart"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures-util = "0.3"
tempfile = "3"
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
