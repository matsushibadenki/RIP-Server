<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>J-RIP</title><link rel="stylesheet" href="/console/style.css"><script src="/console/app.js" defer></script><script src="/console/job-actions.js" defer></script><script src="/console/printer-status.js" defer></script><script src="/console/output-layout.js" defer></script><script src="/console/delivery.js" defer></script><script src="/console/printer-stream.js" defer></script><script src="/console/printer-dashboard.js" defer></script><script src="/console/fonts.js" defer></script><script src="/console/tabs.js" defer></script></head>
<body>
<header><h1>J-RIP</h1><div class="header-actions"><select id="language" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh-CN">简体中文</option></select><button id="connection"><svg viewBox="0 0 24 24"><path d="M15 3a6 6 0 0 0-5 9L3 19v2h4v-3h3l3-3a6 6 0 1 0 2-12Z"/><circle cx="16" cy="8" r="1"/></svg><span data-i18n="connect"></span></button></div></header>
<main data-tab="jobs"><nav class="workspace-tabs" role="tablist" aria-label="Workspace"><button id="tab-jobs" type="button" role="tab" aria-controls="view-jobs" aria-selected="true" tabindex="0" data-i18n="jobs"></button><button id="tab-output" type="button" role="tab" aria-controls="view-output" aria-selected="false" tabindex="-1" data-i18n="physicalOutput"></button><button id="tab-printers" type="button" role="tab" aria-controls="view-printers" aria-selected="false" tabindex="-1" data-i18n="printerDashboard"></button><button id="tab-fonts" type="button" role="tab" aria-controls="view-fonts" aria-selected="false" tabindex="-1" data-i18n="fonts"></button></nav>
<aside id="job-upload-panel" class="panel"><h2 data-i18n="newJob"></h2><form id="upload"><label for="file" data-i18n="file"></label><label class="drop" id="drop" for="file"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg><strong data-i18n="choose"></strong><span id="file-name">PDF · PS · EPS</span></label><input class="file-input" id="file" type="file" accept=".pdf,.ps,.eps,application/pdf,application/postscript" required><label for="dpi" data-i18n="resolution"></label><input id="dpi" type="number" min="72" max="2400" step="1" value="300" required><label for="color" data-i18n="color"></label><select id="color"><option value="rgb">RGB</option><option value="cmyk">CMYK</option><option value="gray" data-i18n="gray"></option></select><label for="engine" data-i18n="engine"></label><select id="engine"><option value="auto" data-i18n="automatic"></option><option value="mupdf">MuPDF</option><option value="ghostscript">Ghostscript</option></select><div class="field-label"><label for="page-ranges" data-i18n="pageRanges"></label><button id="page-ranges-help" class="icon" type="button" data-title="pageRangesHelp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg></button></div><input id="page-ranges" type="text" maxlength="1024" spellcheck="false" autocapitalize="off" data-placeholder="allPages"><label for="priority" data-i18n="priority"></label><input id="priority" type="number" min="0" max="100" value="50" required><button class="primary" id="submit" type="submit" data-i18n="submit" disabled></button></form></aside>
<section class="workspace"><div id="view-jobs" role="tabpanel" aria-labelledby="tab-jobs"><section class="panel queue"><div class="section-head"><h2 data-i18n="jobs"></h2><button id="refresh" class="icon" data-title="refresh" disabled><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></svg></button><span id="count" class="muted"></span></div><section class="inspector"><div class="preview"><div class="section-head"><h3 data-i18n="sourcePreview"></h3><button class="icon" data-title="previewHelp" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg></button></div><div class="preview-stage"><img id="preview-image" alt="" hidden><p id="preview-message" class="muted" data-i18n="selectJob"></p></div><label class="page-control"><span id="page-label" data-i18n="page"></span><select id="page" disabled></select></label></div><div class="details"><h3 id="selected-name" data-i18n="selectJob"></h3><dl id="metadata"></dl><div class="actions"><button id="hold" disabled><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><span data-i18n="hold"></span></button><button id="cancel" class="danger" disabled><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg><span data-i18n="cancel"></span></button></div></div></section><div class="table-scroll"><table><thead><tr><th data-i18n="name"></th><th data-i18n="state"></th><th data-i18n="engine"></th><th data-i18n="updated"></th><th data-i18n="jobActions"></th></tr></thead><tbody id="jobs"></tbody></table></div><p id="empty" class="empty" data-i18n="disconnected"></p><nav class="pagination"><button id="previous" class="icon" data-title="previous" disabled><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><span id="range" class="muted"></span><button id="next" class="icon" data-title="next" disabled><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button></nav></section></div><div id="view-output" role="tabpanel" aria-labelledby="tab-output" hidden><p id="output-tab-empty" class="empty" data-i18n="outputTabEmpty"></p><details id="delivery-panel" class="panel delivery-panel" hidden><summary data-i18n="physicalOutput"></summary><div class="delivery-content"><section id="output-layout" class="output-layout" aria-labelledby="output-layout-heading"><div class="section-head"><h3 id="output-layout-heading" data-i18n="outputLayout"></h3><select id="output-layout-page" aria-label="Page" disabled hidden></select><button type="button" class="icon" data-title="layoutHelp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg></button></div><div id="output-layout-stage" class="output-layout-stage" hidden><div id="output-layout-paper" class="output-layout-paper"><div class="output-layout-crop"><div id="output-layout-position"><img id="output-layout-image" alt="" hidden></div><div id="output-layout-bounds" class="output-layout-bounds"></div></div></div></div><p id="output-layout-dimensions" class="muted"></p><p id="output-layout-status" class="muted" role="status"></p></section><form id="delivery-form" class="delivery-grid"><label><span data-i18n="printer"></span><select id="delivery-printer" required></select></label><label><span data-i18n="media"></span><select id="delivery-media" required></select></label><label><span data-i18n="copies"></span><input id="delivery-copies" type="number" min="1" max="999" value="1" required></label><label><span data-i18n="sides"></span><select id="delivery-sides" required></select></label><label><span data-i18n="colorResult"></span><select id="delivery-color"></select></label><label><span data-i18n="pageRanges"></span><input id="delivery-pages" type="text" maxlength="1024" spellcheck="false" data-placeholder="allPages"></label><label><span data-i18n="placementScale"></span><select id="placement-mode"><option value="original" data-i18n="placementOriginal"></option><option value="fit" da er-live-heading" hidden><div class="printer-live-head"><h3 id="printer-live-heading" data-i18n="printerStatus"></h3><div class="printer-live-actions"><button id="printer-refresh" class="icon" type="button" data-title="refreshPrinter"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></svg></button><button class="icon" type="button" data-title="printerStatusHelp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg></button></div></div><p id="printer-query-state" class="muted" role="status"></p><div id="printer-snapshot-content" hidden><div id="printer-facts" class="printer-facts"></div><ul id="printer-conditions" class="printer-conditions"></ul><details class="printer-supplies" open><summary data-i18n="supplies"></summary><div id="printer-pwg-supplies" class="supply-grid"></div><div id="printer-cups-supplies" class="supply-grid"></div></details></div></section><section id="delivery-review" class="delivery-review" hidden><h3 data-i18n="outputReview"></h3><dl id="delivery-summary"></dl><div id="delivery-grant" hidden><label><span data-i18n="approvalId"></span><input id="delivery-approval" type="text" autocomplete="off" spellcheck="false" maxlength="36"></label><div id="delivery-issuer"><label><span data-i18n="approvalReason"></span><input id="delivery-reason" type="text" maxlength="512"></label><button id="delivery-approve" type="button" data-i18n="approveOutput"></button></div></div><button id="delivery-send" class="primary" type="button" data-i18n="sendOutput" disabled></button></section><div class="delivery-history"><label><span data-i18n="outputHistory"></span><select id="delivery-history"></select></label><button id="delivery-history-more" type="button" data-i18n="moreOutputs" hidden></button><dl id="delivery-status" aria-live="polite"></dl><button id="delivery-cancel" class="danger" type="button" data-i18n="cancelOutput" disabled></button></div></div></details></div><div id="view-printers" role="tabpanel" aria-labelledby="tab-printers" hidden><p id="printers-tab-empty" class="empty" data-i18n="disconnected"></p><details id="printer-dashboard" class="panel printer-dashboard" hidden><summary data-i18n="printerDashboard"></summary><div class="dashboard-content"><p id="dashboard-updates" class="muted" role="status" hidden></p><div class="dashboard-toolbar"><label><span data-i18n="printer"></span><select id="dashboard-printer"></select></label><button id="dashboard-list-refresh" class="icon" type="button" data-title="refresh"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></svg></button></div><section id="dashboard-printer-live" class="printer-live" aria-labelledby="dashboard-printer-live-heading" hidden><div class="printer-live-head"><h3 id="dashboard-printer-live-heading" data-i18n="printerStatus"></h3><div class="printer-live-actions"><button id="dashboard-printer-refresh" class="icon" type="button" data-title="refreshPrinter"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></svg></button><button class="icon" type="button" data-title="printerStatusHelp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg></button></div></div><p id="dashboard-printer-query-state" class="muted" role="status"></p><div id="dashboard-printer-snapshot-content" hidden><div id="dashboard-printer-facts" class="printer-facts"></div><ul id="dashboard-printer-conditions" class="printer-conditions"></ul><details class="printer-supplies" open><summary data-i18n="supplies"></summary><div id="dashboard-printer-pwg-supplies" class="supply-grid"></div><div id="dashboard-printer-cups-supplies" class="supply-grid"></div></details></div></section></div></details></div><div id="view-fonts" role="tabpanel" aria-labelledby="tab-fonts" hidden><section class="panel font-panel"><div class="section-head"><h2 data-i18n="fonts"></h2><s </section>
</main><p id="notice" role="status" aria-live="polite"></p>
<dialog id="login" aria-labelledby="login-title"><form id="login-form"><h2 id="login-title" data-i18n="connect"></h2><label for="token">API token</label><input id="token" type="password" autocomplete="off" required spellcheck="false"><p class="muted" data-i18n="tokenHelp"></p><div class="actions"><button id="close-login" type="button" data-i18n="close"></button><button class="primary" type="submit" data-i18n="connect"></button></div></form></dialog>
<dialog id="delete-job-dialog" aria-labelledby="delete-job-title"><form id="delete-job-form"><h2 id="delete-job-title" data-i18n="deleteJob"></h2><p id="delete-job-name"></p><p class="muted" data-i18n="deleteJobHelp"></p><label id="delete-job-approval-label" hidden><span data-i18n="deleteApproval"></span><input id="delete-job-approval" type="text" maxlength="36" autocomplete="off" spellcheck="false"></label><div class="actions"><button id="delete-job-close" type="button" data-i18n="close"></button><button id="delete-job-confirm" class="danger" type="submit" data-i18n="deleteJob"></button></div></form></dialog></body></html>
