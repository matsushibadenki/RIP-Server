<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>J-RIP</title><link rel="stylesheet" href="/console/style.css"><script src="/console/app.js" defer></script></head>
<body>
<header><h1>J-RIP</h1><div class="header-actions"><select id="language" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh-CN">简体中文</option></select><button id="connection"><svg viewBox="0 0 24 24"><path d="M15 3a6 6 0 0 0-5 9L3 19v2h4v-3h3l3-3a6 6 0 1 0 2-12Z"/><circle cx="16" cy="8" r="1"/></svg><span data-i18n="connect"></span></button></div></header>
<main>
<aside class="panel"><h2 data-i18n="newJob"></h2><form id="upload"><label for="file" data-i18n="file"></label><label class="drop" id="drop" for="file"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg><strong data-i18n="choose"></strong><span id="file-name">PDF · PS · EPS</span></label><input class="file-input" id="file" type="file" accept=".pdf,.ps,.eps,application/pdf,application/postscript" required><label for="dpi" data-i18n="resolution"></label><input id="dpi" type="number" min="72" max="2400" step="1" value="300" required><label for="color" data-i18n="color"></label><select id="color"><option value="rgb">RGB</option><option value="cmyk">CMYK</option><option value="gray" data-i18n="gray"></option></select><label for="engine" data-i18n="engine"></label><select id="engine"><option value="auto" data-i18n="automatic"></option><option value="mupdf">MuPDF</option><option value="ghostscript">Ghostscript</option></select><label for="priority" data-i18n="priority"></label><input id="priority" type="number" min="0" max="100" value="50" required><button class="primary" id="submit" type="submit" data-i18n="submit" disabled></button></form></aside>
<section class="workspace"><section class="panel queue"><div class="section-head"><h2 data-i18n="jobs"></h2><button id="refresh" class="icon" data-title="refresh" disabled><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></svg></button><span id="count" class="muted"></span></div><div class="table-scroll"><table><thead><tr><th data-i18n="name"></th><th data-i18n="state"></th><th data-i18n="engine"></th><th data-i18n="updated"></th></tr></thead><tbody id="jobs"></tbody></table></div><p id="empty" class="empty" data-i18n="disconnected"></p><nav class="pagination"><button id="previous" class="icon" data-title="previous" disabled><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><span id="range" class="muted"></span><button id="next" class="icon" data-title="next" disabled><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button></nav></section>
<section class="panel inspector"><div class="preview"><div class="section-head"><h3 data-i18n="preview"></h3><button class="icon" data-title="previewHelp" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg></button></div><div class="preview-stage"><img id="preview-image" alt="" hidden><p id="preview-message" class="muted" data-i18n="selectJob"></p></div><label class="page-control"><span data-i18n="page"></span><select id="page" disabled></select></label></div><div class="details"><h3 id="selected-name" data-i18n="selectJob"></h3><dl id="metadata"></dl><div class="actions"><button id="hold" disabled><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><span data-i18n="hold"></span></button><button id="cancel" class="danger" disabled><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg><span data-i18n="cancel"></span></button></div></div></section></section>
</main><p id="notice" role="status" aria-live="polite"></p>
<dialog id="login" aria-labelledby="login-title"><form id="login-form"><h2 id="login-title" data-i18n="connect"></h2><label for="token">API token</label><input id="token" type="password" autocomplete="off" required spellcheck="false"><p class="muted" data-i18n="tokenHelp"></p><div class="actions"><button id="close-login" type="button" data-i18n="close"></button><button class="primary" type="submit" data-i18n="connect"></button></div></form></dialog>
</body></html>
