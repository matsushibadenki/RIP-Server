[package]
name = "jrip-mcp"
version.workspace = true
edition.workspace = true
default-run = "jrip-mcp"
[dependencies]
rip-core.workspace = true
base64 = "0.22"
jrip-server = { path = "../jrip-server" }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
rip-storage.workspace = true
futures-util = "0.3"
[dev-dependencies]
ring = "0.17"
tokio = { workspace = true, features = ["test-util"] }
http-body-util = "0.1"
lcms2 = { version = "=6.2.0", features = ["static"] }
rip-color.workspace = true
tempfile = "3"
sha2 = "0.10"

tiff = "0.10"

rip-jobs.workspace = true

rip-raster.workspace = true

rip-ipp.workspace = true
